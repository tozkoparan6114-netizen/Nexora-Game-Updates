name: Publish Nexora game update

on:
  push:
    tags:
      - 'game-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == game-v* ]]; then VERSION="${TAG#game-v}"; else VERSION="1.0.1"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package game
        shell: bash
        run: |
          test -f Nexora/game/index.html
          mkdir -p release-package
          cp -R Nexora/game/. release-package/
          (cd release-package && zip -qr ../LignumVitae-Game.zip .)
          cat > manifest.json <<JSON
          {
            "version": "${{ steps.version.outputs.version }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/LignumVitae-Game.zip"
          }
          JSON
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != game-v* ]]; then TAG="game-v${{ steps.version.outputs.version }}"; fi
          gh release create "$TAG" LignumVitae-Game.zip manifest.json --title "Lignum Vitae ${{ steps.version.outputs.version }}" --notes "Nexora game update ${{ steps.version.outputs.version }}" || gh release upload "$TAG" LignumVitae-Game.zip manifest.json --clobber
